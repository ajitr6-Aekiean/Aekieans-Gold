<title>Esports Arena Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: broadcast-console shell. Top control strip, rig palette left, 3D viewport centre, inspector right, cue + camera bus along the bottom. Single dark look by choice (it's a show console). */
:root{
  --bg:#0b0f15; --panel:#121822; --panel2:#18202c; --line:#263142; --fg:#e2e8f1; --muted:#8693a7;
  --accent:#f5a524; --accent-ink:#1a1204; --tally:#ff3b3b; --ok:#38d39f; --sel:#4cc3ff;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#3a4a62;background:#1e2836}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{border-color:#5a2a2a;color:#ff9b9b}
input[type=text],input[type=number],select{background:#0e141d;border:1px solid var(--line);border-radius:5px;padding:5px 7px;min-width:0}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
input[type=color]{width:38px;height:26px;border:1px solid var(--line);border-radius:5px;background:#0e141d;padding:1px}
input[type=checkbox]{accent-color:var(--accent)}
#app{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);transform:skewX(-18deg);display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.knob{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.knob input{width:80px}
.spacer{flex:1}
.grp{display:flex;gap:6px;flex-wrap:wrap}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);padding:10px}
#right{border-left:1px solid var(--line);padding:10px}
h3{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:600}
h3:first-child{margin-top:2px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 8px;text-align:left;white-space:normal}
.pal button b{font-weight:600;font-size:12px}
.pal button span{color:var(--muted);font-size:10.5px;line-height:1.25}
.pal button.on span{color:#3d2a05}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:0 0 88px;color:var(--muted);font-size:12px}
.row .v{font-family:var(--f-mono);font-size:11px;color:var(--fg);min-width:44px;text-align:right}
.row > input[type=text],.row > select{flex:1}
.stack{display:flex;flex-direction:column;gap:6px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note{color:var(--muted);font-size:11.5px;line-height:1.45}
.mono{font-family:var(--f-mono)}
#view{position:relative;min-width:0;min-height:0;background:#05070a}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none}
#hint{top:10px;left:50%;transform:translateX(-50%);background:rgba(18,24,34,.92);border:1px solid var(--accent);color:var(--fg);padding:7px 12px;border-radius:7px;font-size:12px;max-width:90%;text-align:center}
#fps{left:10px;bottom:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:rgba(5,7,10,.6);padding:3px 6px;border-radius:4px}
#onair{top:10px;left:10px;background:var(--tally);color:#fff;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;padding:4px 10px;border-radius:4px;font-size:12px}
#seatPanel{top:10px;right:10px;background:rgba(18,24,34,.94);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-width:300px;pointer-events:auto}
#seatPanel b{font-family:var(--f-display);font-size:14px;letter-spacing:.04em}
#preview{right:10px;bottom:10px;width:32%;max-width:420px;min-width:180px;aspect-ratio:16/9;border:2px solid var(--accent);border-radius:4px}
#preview span{position:absolute;left:0;top:-22px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:11px;padding:2px 8px;border-radius:3px 3px 0 0;letter-spacing:.06em}
#toasts{left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(560px,92%)}
.toast{background:#18202c;border:1px solid var(--line);border-left:4px solid var(--sel);padding:8px 12px;border-radius:6px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.4);pointer-events:auto}
.toast.err{border-left-color:var(--tally)}
.toast.ok{border-left-color:var(--ok)}
#drop{inset:0;background:rgba(245,165,36,.12);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:22px;letter-spacing:.06em}
#bottom{grid-column:1/-1;border-top:1px solid var(--line);background:var(--panel)}
#cuebar{display:flex;gap:10px;align-items:stretch;padding:8px 12px;border-bottom:1px solid var(--line)}
#cuectl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:330px}
#cuectl label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
#cues{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
.cue{flex:0 0 150px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;position:relative;overflow:hidden;text-align:left;white-space:normal}
.cue .n{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.cue .t{font-weight:600;font-size:12px;margin:1px 0 2px}
.cue .m{font-size:10.5px;color:var(--muted)}
.cue.live{border-color:var(--tally)}
.cue.sel{outline:2px solid var(--sel)}
.cue .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--tally);width:0}
#cambar{display:flex;gap:6px;align-items:center;padding:8px 12px;overflow-x:auto}
#cambar .lbl{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-right:4px}
#cambar button.air{background:var(--tally);border-color:var(--tally);color:#fff;font-weight:600}
#cambar .sp{flex:1}
.kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted);margin-right:4px}
button.on .kbd,button.air .kbd{color:inherit;border-color:currentColor}
.devlist button{display:flex;justify-content:space-between;width:100%;margin:2px 0;text-align:left;background:transparent;border-color:transparent;padding:4px 6px}
.devlist button:hover{background:var(--panel2)}
.devlist small{color:var(--muted)}
.insp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.insp-head .tag{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:4px;color:var(--accent)}
.dims{font-family:var(--f-mono);font-size:11.5px;background:#0e141d;border:1px solid var(--line);border-radius:6px;padding:8px;line-height:1.6}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.xyz input{width:100%}
.mats{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#0e141d}
.matrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-bottom:1px solid var(--line)}
.matrow:last-child{border-bottom:0}
.matrow.sel{background:#1d2a3a;outline:1px solid var(--sel)}
.matrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.matrow .st{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.matrow .st.on{color:var(--ok)}
.matrow button{padding:3px 7px;font-size:11px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto auto auto}
  #top,#bottom{grid-column:1}
  #view{grid-row:2}
  #bottom{grid-row:3}
  #left{grid-row:4;border-right:0;border-top:1px solid var(--line)}
  #right{grid-row:5;border-left:0;border-top:1px solid var(--line)}
  #top,#left,#right,#cuebar,#cambar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #cuebar{flex-direction:column}
  #cuectl{max-width:none}
  #preview{width:45%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><i></i>Arena Planner</div>
    <input id="eventName" type="text" aria-label="Event name" style="width:200px">
    <div class="seg" role="group" aria-label="Lighting mode">
      <button id="mShow" class="on">Show</button><button id="mWork">Work light</button><button id="mBlack">Blackout</button>
    </div>
    <label class="knob" for="dimmer">Dimmer <input id="dimmer" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label class="knob" for="haze">Haze <input id="haze" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <label class="knob" for="glow">Glow <input id="glow" type="range" min="0" max="1.5" step="0.01" value="0.7"></label>
    <div class="spacer"></div>
    <div class="grp">
      <button id="bImport" class="primary">Import 3D model</button>
      <button id="bFolder">Import a whole folder</button>
      <button id="bOpen">Open</button>
      <button id="bSave">Save project</button>
      <button id="bShot">Screenshot</button>
      <button id="bKit">Kit list</button>
    </div>
    <input id="fModel" type="file" multiple hidden accept=".fbx,.obj,.mtl,.glb,.gltf,.bin,.dae,.3ds,.stl,.ply,.zip,.png,.jpg,.jpeg,.webp,.tga,.bmp,.gif,.skp,.max,.c4d,.blend,.3dm,.dwg,.rvt,.usdz">
    <input id="fFolder" type="file" multiple hidden webkitdirectory>
    <input id="fProject" type="file" hidden accept=".json">
    <input id="fMedia" type="file" hidden accept="image/*,video/*">
    <input id="fTex" type="file" hidden>
  </header>

  <aside id="left">
    <h3>Lights</h3>
    <div class="pal" id="palLights"></div>
    <h3>Cameras</h3>
    <div class="pal" id="palCams"></div>
    <h3>Rigging</h3>
    <div class="pal" id="palRig"></div>
    <p class="note" style="margin-top:8px">Click a type, then click the floor, the stage or a truss. Lights clicked onto a truss hang from it. Hold Shift to place several.</p>
    <h3>Views</h3>
    <div class="btns" id="views"></div>
    <h3>Branding</h3>
    <div class="row"><label for="teamA">Team A</label><input id="teamA" type="text"></div>
    <div class="row"><label for="teamB">Team B</label><input id="teamB" type="text"></div>
    <div class="btns"><button id="bMedia">LED image / video</button><button id="bMediaClear">Clear</button></div>
    <h3>Venue</h3>
    <div class="row"><label for="behind">Seats behind stage</label><input id="behind" type="checkbox"></div>
    <div class="row"><label for="placeholder">Placeholder stage</label><input id="placeholder" type="checkbox" checked></div>
    <p class="note" id="venueNote"></p>
    <div class="btns"><button id="bExample">Load example rig</button><button id="bClear" class="danger">Clear rig</button></div>
  </aside>

  <main id="view">
    <canvas id="c"></canvas>
    <div id="hint" class="ov" hidden></div>
    <div id="onair" class="ov" hidden>ON AIR</div>
    <div id="seatPanel" class="ov" hidden></div>
    <div id="preview" class="ov" hidden><span id="previewLbl">PREVIEW</span></div>
    <div id="fps" class="ov"></div>
    <div id="toasts" class="ov"></div>
    <div id="drop" class="ov" hidden>Drop your stage model, textures, ZIP or folder</div>
  </main>

  <aside id="right"><div id="insp"></div></aside>

  <footer id="bottom">
    <div id="cuebar">
      <div id="cuectl">
        <button id="bPlay" class="primary">Play show</button>
        <button id="bNext" title="Next cue (G)"><span class="kbd">G</span>Next cue</button>
        <button id="bRec">Record cue</button>
        <label><input id="cLoop" type="checkbox" checked> Loop</label>
        <label><input id="cCams" type="checkbox" checked> Switch cameras</label>
      </div>
      <div id="cues"></div>
    </div>
    <div id="cambar"></div>
  </footer>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { TDSLoader } from 'three/addons/loaders/TDSLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';
import { unzipSync } from 'three/addons/libs/fflate.module.js';

const $ = s => document.querySelector(s);
const DEG = Math.PI/180, FT = 0.3048;
const FLOOR_W = 250*FT, FLOOR_D = 300*FT, HW = FLOOR_W/2, HD = FLOOR_D/2;
const SF = -HD + 16;              // stage front edge (z)
const DECK_H = 1.5;
const STAGE_C = new THREE.Vector3(0, 3, -HD + 9);
const V3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,k) => a + (b-a)*k;
const hash = n => { const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); };

/* ---------- toasts ---------- */
function toast(msg, kind='info', ms){
  const el = document.createElement('div'); el.className = 'toast ' + (kind==='err'?'err':kind==='ok'?'ok':'');
  el.textContent = msg; $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), ms || (kind==='err' ? 11000 : 4500));
}

/* ---------- state ---------- */
const S = {
  eventName:'APEX ARENA CUP 2026', teamA:'NOVA', teamB:'VORTEX',
  mode:'show', dimmer:1, haze:0.6, glow:0.7, behind:false, placeholder:true,
  devices:[], models:[], cues:[], nextId:1, onAir:null
};
let selected = null;     // {kind:'dev'|'model'|'cue', id}
let placing = null;      // type key
let seatMode = false, seatReturn = null;

/* ---------- renderer / scene ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.FogExp2(0x070a0f, 0.006);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1500);
camera.position.set(62, 52, 78); camera.layers.enableAll();
const ortho = new THREE.OrthographicCamera(-60, 60, 60, -60, 0.1, 500);
ortho.position.set(0, 200, 0.01); ortho.lookAt(0,0,0); ortho.layers.enableAll();
let planMode = false;

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2, -12); controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.495;
const oControls = new OrbitControls(ortho, canvas);
oControls.enableRotate = false; oControls.screenSpacePanning = true; oControls.enabled = false;
oControls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

const tc = new TransformControls(camera, canvas);
tc.setSize(0.8);
tc.getRaycaster().layers.enableAll();
scene.add(tc);
tc.addEventListener('dragging-changed', e => { controls.enabled = !e.value && !S.onAir; });
tc.addEventListener('objectChange', onGizmoMove);
tc.addEventListener('mouseUp', () => { refreshInspectorValues(); markDirty(); });

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
const bloom = new UnrealBloomPass(new THREE.Vector2(512,512), 0.7, 0.55, 0.72);
composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight(0xcfd8ff, 0x20242c, 0.05); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0); sun.position.set(30, 60, 40); scene.add(sun);

/* ---------- venue ---------- */
const venue = new THREE.Group(); scene.add(venue);
const placeTargets = [];   // meshes you can place onto
const floorMat = new THREE.MeshStandardMaterial({ color:0x1b212b, roughness:0.82, metalness:0.05 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_W, FLOOR_D), floorMat);
floor.rotation.x = -Math.PI/2; floor.name = 'floor'; venue.add(floor); placeTargets.push(floor);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color:0x0c0f14, roughness:1 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; venue.add(ground); placeTargets.push(ground);
{ // 10 ft grid, brighter every 50 ft
  const minor = [], major = [];
  for (let i=0;i<=25;i++){ const x = -HW + i*10*FT; (i%5?minor:major).push(x,0.01,-HD, x,0.01,HD); }
  for (let j=0;j<=30;j++){ const z = -HD + j*10*FT; (j%5?minor:major).push(-HW,0.01,z, HW,0.01,z); }
  const mk = (arr,c,o) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr,3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color:c, transparent:true, opacity:o })); };
  venue.add(mk(minor, 0x3a4658, 0.35)); venue.add(mk(major, 0x5a6a82, 0.55));
}
function labelSprite(text, w, size=64, color='#8fa0b8'){
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 128;
  const g = cv.getContext('2d'); g.fillStyle = color; g.font = `600 ${size}px "Chakra Petch", sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 512, 64);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w/8), new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, opacity:0.75 }));
  m.rotation.x = -Math.PI/2; m.raycast = ()=>{}; m.userData.redraw = () => { g.clearRect(0,0,1024,128); g.fillText(text,512,64); tex.needsUpdate = true; };
  return m;
}
const floorLabel = labelSprite('ARENA FLOOR  ·  250 × 300 FT', 40); floorLabel.position.set(0, 0.03, 20); venue.add(floorLabel);
// FOH platform
const fohGroup = new THREE.Group(); venue.add(fohGroup);
{
  const plat = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, 5), new THREE.MeshStandardMaterial({ color:0x262d38, roughness:.7 }));
  plat.position.set(0, 0.3, 13); fohGroup.add(plat); placeTargets.push(plat);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(6, 0.9, 1.1), new THREE.MeshStandardMaterial({ color:0x15191f, roughness:.5 }));

const ext = n => (n.split('.').pop() || '').toLowerCase();

async function expandFiles(fileList){
  const out = [];
  for (const f of fileList){
    if (ext(f.name)==='zip'){
      try {
        const z = unzipSync(new Uint8Array(await f.arrayBuffer()));
        for (const [path, data] of Object.entries(z)){ if (path.endsWith('/') || path.startsWith('__MACOSX') || base(path).startsWith('._')) continue; out.push(new File([data], base(path))); }
      } catch(e){ toast(`Couldn't open ${f.name}: the ZIP looks damaged or uses an unsupported compression. Re-zip it, or unzip and use Import a whole folder.`, 'err'); }
    } else out.push(f);
  }
  return out;
}
function makeManager(files, missing){
  const map = new Map(); for (const f of files) map.set(base(f.name).toLowerCase(), f);
  const urls = new Map();
  const mgr = new THREE.LoadingManager();
  mgr.setURLModifier(url => {
    if (/^(data|blob):/.test(url)) return url;
    let u; try { u = decodeURIComponent(url); } catch { u = url; }
    const b = base(u).split('?')[0].toLowerCase();
    let f = map.get(b);
    if (!f){ const stem = b.replace(/\.[^.]+$/,''); for (const [k,v] of map) if (k.replace(/\.[^.]+$/,'')===stem && /\.(png|jpe?g|webp|bmp|gif|tga)$/.test(k)) { f = v; break; } }
    if (!f){ missing.add(base(u)); return BLANK; }
    if (!urls.has(f)) urls.set(f, URL.createObjectURL(f));
    return urls.get(f);
  });

}
async function parseModel(main, files, missing){
  const e = ext(main.name), mgr = makeManager(files, missing);

      if (!head.startsWith('Kaydara FBX Binary')){ const m = new TextDecoder().decode(new Uint8Array(buf.slice(0, 2000))).match(/FBXVersion:\s*(\d+)/); if (m && +m[1] < 7000) throw new Error(`This FBX is version ${m[1]}, which is too old. Re-export it as binary FBX 2014 or newer.`); }

    case 'glb': case 'gltf': {
      const data = e==='glb' ? await main.arrayBuffer() : await main.text();
      return await new Promise((res, rej) => new GLTFLoader(mgr).parse(data, '', g => res(g.scene), err => {
        const s = String(err && err.message || err); rej(new Error(/draco|KHR_draco|meshopt|ktx2|basisu/i.test(s) ? 'This GLB uses Draco/Meshopt/KTX2 compression, which this planner can\'t decode. Export it again without compression.' : 'The glTF file couldn\'t be read: ' + s)); }));

    case '3ds': { const l = new TDSLoader(mgr); l.setResourcePath(''); return l.parse(await main.arrayBuffer(), ''); }

}
function guessUnits(maxDim){ if (maxDim > 3000) return 'mm'; if (maxDim > 250) return 'cm'; return 'm'; }

async function importFiles(fileList, fromProject=null){
  if (!fileList || !fileList.length) return;
  const files = await expandFiles([...fileList]);
  const mains = files.filter(f => MAIN_EXT.includes(ext(f.name)));
  if (!mains.length){
    const bad = files.find(f => UNSUPPORTED[ext(f.name)]);
    if (bad) toast(UNSUPPORTED[ext(bad.name)], 'err', 16000);
    else toast(`No 3D model found in what you chose (${files.length} file${files.length===1?'':'s'}). Choose an FBX, OBJ (with its .mtl), GLB, GLTF, DAE, 3DS, STL or PLY file, or a ZIP or folder containing one.`, 'err');
    return;
  }
  const preferred = mains.some(f => ext(f.name)==='glb'||ext(f.name)==='gltf') ? mains.filter(f => !(ext(f.name)==='obj' && mains.some(g=>ext(g.name)==='fbx'))) : mains;
  for (const main of preferred){
    toast(`Loading ${main.name} (${(main.size/1048576).toFixed(1)} MB)…`);
    await new Promise(r => setTimeout(r, 30));
    const missing = new Set();
    try {
      const root = await parseModel(main, files, missing);
      if (!root) throw new Error('The file loaded but contained nothing.');
      const kept = files.filter(f => f===main || !MAIN_EXT.includes(ext(f.name)) || (ext(main.name)==='gltf' && ext(f.name)==='bin'));
      const m = fromProject ? Object.assign(fromProject, { files: kept }) : { id:S.nextId++, name: main.name.replace(/\.[^.]+$/,''), units:'auto', selfLit:true, visible:true, pos:null, rotX:0, rotY:0, rotZ:0, scale:[1,1,1], tex:[], files: kept };
      m.scale = m.scale || [1,1,1]; m.tex = m.tex || [];
      m.rt && modelGroup.remove(m.rt.g);
      installModel(m, root);
      for (const t of m.tex) applyTex(m, t, false);
      if (!fromProject){ S.models.push(m); select({ kind:'model', id:m.id }); }
      const sz = modelSize(m);
      toast(`Imported ${main.name}: ${sz.x.toFixed(1)} × ${sz.z.toFixed(1)} × ${sz.y.toFixed(1)} m (W × D × H), units ${m.rt.unitsUsed}. Check the size in the inspector.`, 'ok', 7000);
      if (missing.size) toast(`Some textures were not found: ${[...missing].slice(0,6).join(', ')}${missing.size>6?'…':''}. Select the texture files together with the model, or import the whole folder.`, 'err', 14000);
      if (S.placeholder && !fromProject){ S.placeholder = false; $('#placeholder').checked = false; applyVenue(); }
      markDirty();
    } catch(err){
      console.error(err);
      toast(`Couldn't import ${main.name}. ${err.message || err}`, 'err', 16000);
    }
  }
}
function installModel(m, root){
  m.rt_gltf = /\.(glb|gltf)$/i.test(m.files.find(f => MAIN_EXT.includes(ext(f.name)))?.name || '');
  const strip = []; root.traverse(o => { if (o.isLight || o.isCamera) strip.push(o); }); strip.forEach(o => o.parent && o.parent.remove(o));

  root.updateMatrixWorld(true);

  const auto = guessUnits(Math.max(rs.x, rs.y, rs.z));

  root.traverse(o => { if (o.isMesh){ o.userData.modelId = m.id; if (!o.material) o.material = new THREE.MeshStandardMaterial({ color:0x9aa4b2 });

}
function applyModelUnits(m, place){

const modelSize = m => m.rt.size.clone().multiply(V3(...(m.scale||[1,1,1])).set(Math.abs(m.scale[0]), Math.abs(m.scale[1]), Math.abs(m.scale[2])));

let texTarget = null;
const IMG_ACCEPT = '.png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp';
const VID_ACCEPT = '.mp4,.webm,.mov,.m4v,video/mp4,video/webm,video/quicktime';
function chooseTex(m, idx, kind){ texTarget = { m, idx, kind }; const f = $('#fTex'); f.accept = kind==='video' ? VID_ACCEPT : IMG_ACCEPT; f.click(); }
$('#fTex').onchange = e => {

  const { m, idx, kind } = texTarget; texTarget = null;
  const isVid = /^video\//.test(f.type) || /\.(mp4|webm|mov|m4v)$/i.test(f.name), isImg = /^image\//.test(f.type) || /\.(png|jpe?g|webp)$/i.test(f.name);

/* ---------- drag & drop (files and folders) ---------- */
const view = $('#view');
async function readEntry(entry, out){
  if (entry.isFile) await new Promise(r => entry.file(f => { out.push(f); r(); }, r));
  else if (entry.isDirectory){ const rd = entry.createReader(); let batch;
    do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const e of batch) await readEntry(e, out); } while (batch.length); }
}
let dragDepth = 0;
view.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
view.addEventListener('dragover', e => { e.preventDefault(); });
view.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('#drop').hidden = true; } });
view.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  const items = [...(e.dataTransfer.items||[])]; const out = [];
  const entries = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) { for (const en of entries) await readEntry(en, out); } else out.push(...e.dataTransfer.files);
  const proj = out.find(f => ext(f.name)==='json'); if (proj && out.length===1) return openProject(proj);
  importFiles(out);
});

/* ---------- picking & placement ---------- */
const ray = new THREE.Raycaster(); ray.layers.enableAll();
const mouse = new THREE.Vector2();

function setRay(e){ const r = canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mouse, activeCam()); }
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY }; aimDrag = S.onAir && e.button===0 ? { x:e.clientX, y:e.clientY } : null; });
let aimDrag = null;
canvas.addEventListener('pointermove', e => {
  if (!aimDrag || !S.onAir || !(e.buttons & 1)) return;
  const d = getDev(S.onAir); if (!d) return;
  const k = 0.08 * clamp(35 / (+d.p.focal), 0.05, 2);

  d.p.focal = Math.round(clamp(d.p.focal * Math.pow(1.1, -Math.sign(e.deltaY)), 8, 400)); throttledRefresh(); markDirty();

    pos = tr.rt.g.localToWorld(local); extra.mount = 'hung';

  selected = sel; tc.detach(); if (tc.mode==='scale' && !(sel && sel.kind==='model')) tc.setMode('translate');
  if (sel && sel.kind==='dev'){ const d = getDev(sel.id); if (d && d.rt) { tc.attach(d.rt.g); tc.setMode('translate'); } }
  if (sel && sel.kind==='model'){ const m = getModel(sel.id); if (m && m.rt) { tc.attach(m.rt.g); } }
  renderInspector(); renderCues();
}
function onGizmoMove(){
  const o = tc.object; if (!o || !selected) return;
  if (selected.kind==='dev'){ const d = getDev(selected.id); d.pos = [o.position.x, o.position.y, o.position.z];
    if (d.type==='truss') { d.p.rotY = Math.round(o.rotation.y/DEG); }
    else if (TYPE[d.type].kind==='camera' && tc.mode==='rotate'){ d.p.pan = +(d.p.pan + o.rotation.y/DEG).toFixed(1); o.rotation.set(0,0,0); }
    else o.rotation.set(0,0,0);
  } else if (selected.kind==='model'){ const m = getModel(selected.id); m.pos = [o.position.x, o.position.y, o.position.z];
    m.rotX = Math.round(o.rotation.x/DEG); m.rotY = Math.round(o.rotation.y/DEG); m.rotZ = Math.round(o.rotation.z/DEG);
    m.scale = [o.scale.x, o.scale.y, o.scale.z].map(v => +v.toFixed(3)); }
  throttledRefresh();
}
let refreshT = 0; function throttledRefresh(){ const n = performance.now(); if (n - refreshT > 120){ refreshT = n; refreshInspectorValues(); } }

function fieldRow(f, obj, onChange, idp){

  else if (f.t==='select'){ input = el('select', { id, on:{ change:e => onChange(f.k, isNaN(+e.target.value) ? e.target.value : +e.target.value) } }); for (const o of f.o) input.append(el('option', { value:o, selected: String(o)===String(v) }, String(o))); }
  else if (f.t==='color'){ input = el('input', { type:'color', id, value:v, on:{ input:e => onChange(f.k, e.target.value) } }); }
  else if (f.t==='bool'){ input = el('input', { type:'checkbox', id, checked:v!==false, on:{ change:e => onChange(f.k, e.target.checked) } }); }
  else { input = el('input', { type:'text', id, value:v, on:{ input:e => onChange(f.k, e.target.value) } }); }

const fmt = (v, step) => (step && step < 1) ? (+v).toFixed(step < 0.1 ? 2 : 1) : String(v);

function refreshInspectorValues(){
  if (!selected) return;
  const arr = selected.kind==='dev' ? getDev(selected.id)?.pos : selected.kind==='model' ? getModel(selected.id)?.pos : null;
  const p = selected.kind==='dev' ? 'dv_pos' : 'md_pos';
  if (arr) ['X','Y','Z'].forEach((a,i) => { const e = document.getElementById(`${p}_${a}`); if (e && document.activeElement!==e) e.value = (+arr[i]).toFixed(2); });
  if (selected.kind==='dev'){ const d = getDev(selected.id); if (!d) return;
    for (const k of ['pan','tilt','focal','rotY']){ const e = document.getElementById('dv_'+k); if (e && document.activeElement!==e){ e.value = d.p[k]; const v = e.parentElement.querySelector('.v'); if (v) v.textContent = d.p[k]; } } }
  if (selected.kind==='model'){ const m = getModel(selected.id); if (!m) return;
    [m.rotX, m.rotY, m.rotZ].forEach((v,i) => { const e = document.getElementById('md_rot_' + 'XYZ'[i]); if (e && document.activeElement!==e) e.value = (+v).toFixed(0); });
    m.scale.forEach((v,i) => { const e = document.getElementById('md_scl_' + 'XYZ'[i]); if (e && document.activeElement!==e) e.value = (+v).toFixed(3); });

}
function copyLook(src){
  const keys = ['on','intensity','color','color2','effect','pattern','angle','speed','rate','spread'];
  let n = 0; for (const d of S.devices) if (d!==src && d.type===src.type){ for (const k of keys) if (k in src.p) d.p[k] = src.p[k]; n++; }
  toast(`Copied the look to ${n} other ${TYPE[src.type].label}${n===1?'':'s'}.`, 'ok'); markDirty();
}
function spreadPhases(src){
  const list = S.devices.filter(d => d.type===src.type).sort((a,b) => a.pos[0]-b.pos[0]);
  list.forEach((d,i) => d.p.phase = +(i/list.length).toFixed(2)); toast(`Spread phases across ${list.length} lights, left to right.`, 'ok'); renderInspector(); markDirty();
}
function deleteSel(){
  if (!selected) return;
  if (selected.kind==='model') return removeModel(getModel(selected.id));
  if (selected.kind==='cue'){ S.cues = S.cues.filter(c => c.id!==selected.id); select(null); renderCues(); markDirty(); return; }
  const d = getDev(selected.id); if (!d) return;
  tc.detach(); disposeDevice(d); S.devices = S.devices.filter(x => x!==d);
  if (S.onAir===d.id) setOnAir(null);

}
function duplicateSel(){
  if (!selected || selected.kind!=='dev') return; const d = getDev(selected.id);
  const off = d.type==='truss' ? V3(0,0,3) : V3(1.5,0,0);

  select({ kind:'dev', id:n.id }); refreshCamBar(); markDirty();
}

function camFromView(dev){
  if (planMode) setPlan(false);
  const pos = camera.position, dir = controls.target.clone().sub(pos);
  const hf = 2*Math.atan(Math.tan(camera.fov*DEG/2) * camera.aspect);
  let d = dev;
  if (!d){ d = addDevice('cam_tripod', V3(pos.x, 0, pos.z), { name:`CAM ${camDevices().length+1} · From view` }); }
  if (d.type==='cam_jib'){ d.type = 'cam_tripod'; d.p = { ...TYPE.cam_tripod.d, ...d.p }; rebuild(d); }
  d.pos = [pos.x, 0, pos.z]; d.rt.g.position.fromArray(d.pos);
  d.p.height = +clamp(pos.y, 0.3, 40).toFixed(2);
  d.p.pan = +(Math.atan2(-dir.x, -dir.z)/DEG).toFixed(1); d.p.tilt = +clamp(Math.atan2(dir.y, Math.hypot(dir.x, dir.z))/DEG, -80, 60).toFixed(1);

const LOOK_NUM = ['intensity','angle','pan','tilt','speed','phase','rate','spread'];
const LOOK_DISC = ['effect','pattern'];
function captureLook(){
  const lights = {};
  for (const d of S.devices) if (TYPE[d.type].kind==='light' && d.type!=='pyro'){
    const o = {}; for (const k of [...LOOK_NUM, ...LOOK_DISC, 'on', 'color', 'color2']) if (k in d.p) o[k] = d.p[k]; lights[d.id] = o; }
  return { mode:S.mode, dimmer:S.dimmer, haze:S.haze, lights };
}
let fade = null;
function applyLook(look, dur){
  const from = captureLook();
  for (const [id, L] of Object.entries(look.lights)){ const d = getDev(+id); if (!d) continue; for (const k of LOOK_DISC) if (k in L) d.p[k] = L[k]; }
  if (look.mode !== S.mode) setMode(look.mode);
  if (!dur){ finishLook(look); return; }
  fade = { from, to:look, s:performance.now(), dur:dur*1000 };
}
function finishLook(look){
  for (const [id, L] of Object.entries(look.lights)){ const d = getDev(+id); if (!d) continue; Object.assign(d.p, L); }
  S.dimmer = look.dimmer; S.haze = look.haze; syncTopUI(); fade = null;
  if (selected && selected.kind==='dev') renderInspector();
}
function stepFade(){
  if (!fade) return; const k = clamp((performance.now() - fade.s)/fade.dur, 0, 1); const e = k*k*(3-2*k);
  for (const [id, L] of Object.entries(fade.to.lights)){ const d = getDev(+id), F = fade.from.lights[id]; if (!d || !F) continue;
    const fi = F.on===false ? 0 : F.intensity, ti = L.on===false ? 0 : L.intensity;
    d.p.on = true; d.p.intensity = lerp(fi, ti, e);
    for (const k2 of LOOK_NUM) if (k2!=='intensity' && k2 in L && k2 in F) d.p[k2] = lerp(+F[k2], +L[k2], e);
    for (const ck of ['color','color2']) if (L[ck] && F[ck]) d.p[ck] = '#' + new THREE.Color(F[ck]).lerp(new THREE.Color(L[ck]), e).getHexString();
  }
  S.dimmer = lerp(fade.from.dimmer, fade.to.dimmer, e); S.haze = lerp(fade.from.haze, fade.to.haze, e);
  if (k >= 1) finishLook(fade.to);
}

}

const keys = {};

  const tag = (e.target.tagName||'').toLowerCase(); if (tag==='input' || tag==='select' || tag==='textarea') return;

  else if (/^[1-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey){ const c = camDevices()[+e.key-1]; if (c) setOnAir(c.id); }
  else if (e.key==='0') setOnAir(null);
  else if (e.key==='v' || e.key==='V'){ seatMode ? exitSeat(true) : enterSeat(); }
  else if (e.key==='g' || e.key==='G') goCue(PB.idx + 1);
  else if (e.key==='t' || e.key==='T') tc.setMode('translate');
  else if (e.key==='r' || e.key==='R') { tc.setMode('rotate'); if (selected && selected.kind==='model') renderInspector(); }
  else if ((e.key==='y' || e.key==='Y') && selected && selected.kind==='model') { tc.setMode('scale'); renderInspector(); }
  else if (e.key==='Delete' || e.key==='Backspace') deleteSel();

function stepFly(dt){
  if (S.onAir || planMode || seatMode) return;
  const f = (keys.KeyW?1:0) - (keys.KeyS?1:0), s = (keys.KeyD?1:0) - (keys.KeyA?1:0), u = (keys.KeyE?1:0) - (keys.KeyQ?1:0);
  if (!f && !s && !u) return;
  const sp = (keys.ShiftLeft||keys.ShiftRight ? 40 : 14)*dt;
  const fw = controls.target.clone().sub(camera.position); fw.y = 0; fw.normalize(); const rt = V3().crossVectors(fw, V3(0,1,0));
  const mv = V3().addScaledVector(fw, f*sp).addScaledVector(rt, s*sp).add(V3(0, u*sp, 0));

      tex:(m.tex||[]).map(t => ({ mat:t.mat, kind:t.kind, name:t.name, rx:t.rx, ry:t.ry, file:new File([unb64(t.data)], t.name) })) };

  else if ((j.models||[]).length) toast(`Your last session had ${j.models.length} imported model${j.models.length>1?'s':''}. Models are only kept in saved project files: use Open to load yours, or import the model again.`, 'info', 9000);
}
$('#bShot').onclick = () => { renderFrame(); canvas.toBlob(b => saveFile(`${slug()}-${S.onAir ? getDev(S.onAir).name.replace(/\W+/g,'-').toLowerCase() : 'view'}.png`, b), 'image/png'); };
$('#bKit').onclick = () => {
  const rows = [['Category','Type','Name','X m','Y m','Z m','Mount','Details']];
  for (const d of S.devices){ const T = TYPE[d.type], p = d.p; let det = '';
    if (T.kind==='light') det = d.type==='pyro' ? `${p.style}, ${p.height} m, ${p.duration} s` : d.type==='laser' ? `${p.beams} beams, ${p.spread}°` : d.type==='matrix' ? '5x5 pixel' : `${p.angle}° beam${d.type==='toner'?`, ${p.cells} cells`:''}`;
    else if (T.kind==='camera') det = `${p.focal} mm` + (d.type==='cam_jib' ? `, ${p.arm} m arm` : `, lens ${p.height} m`);
    else det = `${p.length} m`;
    rows.push([T.kind, T.label, d.name, d.pos[0].toFixed(2), d.pos[1].toFixed(2), d.pos[2].toFixed(2), d.mount||'', det]); }
  for (const m of S.models) rows.push(['model','3D model',m.name, ...m.pos.map(v=>(+v).toFixed(2)), '', m.rt ? (s => `${s.x.toFixed(1)} x ${s.z.toFixed(1)} x ${s.y.toFixed(1)} m`)(modelSize(m)) + ((m.tex||[]).length ? `; textures: ${m.tex.map(t=>t.name).join(' / ')}` : '') : '']);
  const counts = {}; S.devices.forEach(d => counts[TYPE[d.type].label] = (counts[TYPE[d.type].label]||0)+1);
  rows.push([]); rows.push(['Totals']); for (const [k,v] of Object.entries(counts)) rows.push([k, v]);
  const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g,'""')}"` : c).join(',')).join('\n');
  saveFile(`${slug()}-kit-list.csv`, csv);
};
let dirtyT = null;
function markDirty(){ clearTimeout(dirtyT); dirtyT = setTimeout(async () => { try { localStorage.setItem('arena-planner-v1', JSON.stringify(await serialize(false))); } catch {} }, 600); }

/* ---------- example rig ---------- */
function exampleRig(){
  const tr = (x,y,z,L,r=0) => addDevice('truss', V3(x,y,z), { p:{ length:L, rotY:r } });
  tr(0, 11, SF-1, 34); tr(0, 12.5, -HD+8, 30); tr(-19, 11, -HD+9, 16, 90); tr(19, 11, -HD+9, 16, 90); tr(0, 13, -6, 40);
  const hang = (type, x, y, z, p={}) => addDevice(type, V3(x, y-0.45, z), { mount:'hung', p });
  for (let i=0;i<10;i++){ const x = -15 + i*(30/9); hang('moving', x, 11, SF-1, { tilt:30, pan:0, color:'#3f9dff' }); }
  for (let i=0;i<6;i++){ const d = hang('wash', -12.5 + i*5, 12.5, -HD+8, { color:'#7a3cff' }); aimLight(d, V3(d.pos[0], DECK_H, -HD+10)); }
  hang('strobe', -16, 12.5, -HD+8); hang('strobe', 16, 12.5, -HD+8);
  for (const x of [-15,-5,5,15]){ const d = hang('moving', x, 13, -6, { color:'#ff5a3c' }); aimLight(d, V3(x*0.6, DECK_H, -HD+10)); }
  hang('laser', -6, 12.5, -HD+8, { pan:180, tilt:82, pattern:'fan', color:'#2bff7a' }); hang('laser', 6, 12.5, -HD+8, { pan:180, tilt:82, pattern:'fan', color:'#2bff7a', phase:.5 });
  for (const [x,z] of [[-HW-17,-12],[HW+17,-12],[-24,HD+18],[24,HD+18]]){ const d = addDevice('stadium', V3(x, 13, z)); aimLight(d, STAGE_C); }
  for (const x of [-10,10]){ const d = addDevice('toner', V3(x, DECK_H, SF-0.5)); aimLight(d, V3(x*2.5, 6, HD+8)); }
  for (const x of [-17,17]) addDevice('matrix', V3(x, DECK_H, SF-0.6), { p:{ pan:180, tilt:90, pattern:x<0?'wave':'rings' } });
  for (const x of [-14,-5,5,14]) addDevice('pyro', V3(x, DECK_H, SF-0.5), { p:{ style: Math.abs(x)>10 ? 'flame jet' : 'fountain', height: Math.abs(x)>10 ? 5 : 7 } });
  const c1 = addDevice('cam_tripod', V3(0, 0.6, 12), { name:'CAM 1 · FOH wide', p:{ focal:35 } }); aimCam(c1, V3(0, 4.5, -HD+8));
  const c2 = addDevice('cam_jib', V3(-13, 0, -21), { name:'CAM 2 · Jib', p:{ arm:8, swing:35, elev:22, focal:20 } }); aimCam(c2, V3(0, 3, -HD+10));
  const c3 = addDevice('cam_ptz', V3(-17, DECK_H, -HD+4), { name:'CAM 3 · Player PTZ', p:{ height:2.2, focal:30 } }); aimCam(c3, V3(-7.5, DECK_H+1.2, -HD+9.4));
  const c4 = addDevice('cam_steadi', V3(7, 0, -20), { name:'CAM 4 · Steadicam', p:{ focal:24 } }); aimCam(c4, V3(0, DECK_H+2, -HD+10));
  // cues
  const L = t => S.devices.filter(d => d.type===t);
  const mh = L('moving'), wash = L('wash'), strobe = L('strobe'), stad = L('stadium'), toner = L('toner'), mtx = L('matrix'), las = L('laser');
  const set = (list, p) => list.forEach((d,i) => Object.assign(d.p, typeof p==='function' ? p(d,i) : p));
  const rec = (name, hold, fadeT, cam, pyro) => S.cues.push({ id:S.nextId++, name, hold, fade:fadeT, cam:cam?cam.id:null, pyro, look:captureLook() });
  S.mode = 'show'; S.dimmer = 0.85; S.haze = 0.55;
  set(mh, (d,i) => ({ on:true, intensity:.65, color:'#3f9dff', effect:'sweep', speed:.4, phase:i/14 })); set(wash, { on:true, intensity:.7, color:'#2a4dff', effect:'pulse', speed:.4 });
  set(strobe, { on:false }); set(stad, { on:true, intensity:.25, effect:'none' }); set(toner, { on:true, intensity:.35, effect:'warm pulse' }); set(mtx, { on:true, intensity:.6, pattern:'wave' }); set(las, { on:false });
  rec('Doors & walk-in', 7, 2, c1, false);
  S.dimmer = 1;
  set(mh, (d,i) => ({ on:true, intensity:1, color:'#ff2a3a', effect:'circle', speed:1.2, phase:i/14 })); set(wash, (d,i) => ({ intensity:1, color:'#ff1030', effect:'chase', speed:1.5, phase:i/6 }));
  set(stad, { on:false }); set(toner, { on:false }); set(mtx, { pattern:'chase', color:'#ff2040', color2:'#ff9020' }); set(las, { on:true, intensity:1, color:'#ff2a2a', pattern:'cone', speed:1.2 });
  rec('Countdown', 5, 1, c2, false);
  set(mh, (d,i) => ({ color:'#ffffff', effect:'ballyhoo', speed:1.6, phase:i/14 })); set(wash, { color:'#ffffff', effect:'none' }); set(strobe, { on:true, intensity:1, effect:'flash', rate:10 });
  set(toner, { on:true, intensity:1, effect:'chase' }); set(mtx, { pattern:'sparkle', color:'#ffffff', color2:'#ffd080' }); set(las, { color:'#2bff7a', pattern:'fan', speed:1 });
  rec('Team intro hit', 5, 0, c4, true);
  set(mh, (d,i) => ({ color: d.pos[0] < 0 ? '#3fb8ff' : '#ff7a3d', effect:'none', intensity:.8 })); mh.slice(0,10).forEach(d => aimLight(d, V3(d.pos[0]*0.55, DECK_H+1, -HD+9.5)));
  set(wash, d => ({ color: d.pos[0] < 0 ? '#1d7dff' : '#ff6a1d', effect:'none', intensity:.85 })); set(strobe, { on:false }); set(stad, { on:true, intensity:.7 }); set(toner, { on:false });
  set(mtx, { pattern:'rings', color:'#3fb8ff', color2:'#ff7a3d' }); set(las, { on:false });
  rec('Match live', 8, 2, c3, false);
  set(mh, (d,i) => ({ effect:'colour cycle', speed:1.2, phase:i/14, intensity:1 })); mh.slice(0,10).forEach(d => { d.p.tilt = 30; d.p.pan = 0; }); set(wash, (d,i) => ({ effect:'colour cycle', phase:i/6 }));
  set(strobe, { on:true, effect:'random', rate:8 }); set(stad, { on:false }); set(toner, { on:true, effect:'warm pulse', intensity:1 }); set(las, { on:true, pattern:'scan', color:'#2bd0ff', speed:1.4 });
  set(mtx, { pattern:'sparkle', color:'#ffd040', color2:'#ff40d0' });
  rec('Victory', 8, 0.5, c2, true);
  PB.idx = -1; applyLook(S.cues[0].look, 0); syncTopUI(); setMode('show');
  refreshCamBar(); renderCues(); renderInspector();
}

/* ---------- render loop ---------- */
const view2 = $('#view'); let VW = 1, VH = 1;
function resize(){
  const r = view2.getBoundingClientRect(); VW = Math.max(1, r.width); VH = Math.max(1, r.height);
  renderer.setSize(VW, VH, false); composer.setSize(VW, VH);
  bloom.resolution.set(VW/2, VH/2);
  camera.aspect = VW/VH; camera.updateProjectionMatrix();
  const half = 70; ortho.left = -half*VW/VH; ortho.right = half*VW/VH; ortho.top = half; ortho.bottom = -half; ortho.updateProjectionMatrix();
  pMat.uniforms.uScale.value = VH * 0.9;
}
new ResizeObserver(resize).observe(view2);
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShow = 60, ledT = 0;
function renderFrame(){
  const cam = activeCam();
  if (S.onAir){ cam.aspect = VW/VH; cam.updateProjectionMatrix(); }
  renderPass.camera = cam;
  const airDev = S.onAir ? getDev(S.onAir) : null; if (airDev && airDev.rt) airDev.rt.camHead.visible = false;
  bloom.strength = S.glow * (S.mode==='show' ? 1 : 0.25);
  renderer.setScissorTest(false); renderer.setViewport(0,0,VW,VH);
  composer.render();
  const pv = $('#preview');
  const selCam = selected && selected.kind==='dev' && TYPE[getDev(selected.id)?.type]?.kind==='camera' ? getDev(selected.id) : null;
  if (selCam && selCam.id !== S.onAir && selCam.rt){
    pv.hidden = false; $('#previewLbl').textContent = 'PREVIEW · ' + selCam.name;
    const vr = view2.getBoundingClientRect(), r = pv.getBoundingClientRect();
    const x = r.left - vr.left, y = VH - (r.bottom - vr.top), w = r.width, h = r.height;
    const c = selCam.rt.cam; c.aspect = w/h; c.updateProjectionMatrix();
    renderer.setViewport(x,y,w,h); renderer.setScissor(x,y,w,h); renderer.setScissorTest(true);
    renderer.autoClear = true; selCam.rt.camHead.visible = false; renderer.render(scene, c); selCam.rt.camHead.visible = true;
    renderer.setScissorTest(false); renderer.setViewport(0,0,VW,VH);
  } else pv.hidden = true;
  if (airDev && airDev.rt) airDev.rt.camHead.visible = true;
}
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(0.05, (now-last)/1000); last = now; const t = now/1000;
  if (fly){ const k = clamp((now - fly.s)/fly.dur, 0, 1), e = 1 - Math.pow(1-k, 3); camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (k>=1) fly = null; }
  stepFly(dt);
  if (planMode) oControls.update(); else controls.update();
  stepFade(); stepPlayback();
  hemi.intensity = S.mode==='work' ? 1.25 : S.mode==='show' ? 0.07 : 0.015;
  sun.intensity = S.mode==='work' ? 1.6 : 0;
  scene.fog.density = S.mode==='show' ? 0.002 + S.haze*0.006 : 0.0015;
  scene.fog.color.set(S.mode==='work' ? 0x1a1f28 : 0x07090d);
  updateLights(t, dt); stepParticles(dt); updateCameras(t);
  if (now - ledT > 66){ ledT = now; drawLED(t); }
  ribTex.offset.x = (t*0.04) % 1;
  const ledK = S.mode==='blackout' ? 0.02 : S.mode==='show' ? 1.25 : 0.9;
  ledMats.forEach(m => m.color.setScalar(ledK));
  renderFrame();
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5){ fpsShow = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0;
    $('#fps').textContent = `${fpsShow.toFixed(0)} fps · ${realUsed}/${POOL} real lights${realWanted>POOL?` (${realWanted-POOL} beam-only)`:''} · ${S.devices.length} devices`; }
}

/* ---------- boot ---------- */
buildStands(); applyVenue(); resize();
let restored = false;
try { const raw = localStorage.getItem('arena-planner-v1'); if (raw){ const j = JSON.parse(raw); if (j && j.app==='esports-arena-planner' && (j.devices||[]).length){ loadProject(j, false); restored = true; } } } catch {}
if (!restored){ exampleRig(); syncTopUI(); }
refreshCamBar(); renderCues(); renderInspector();
if (restored) toast('Restored your last session from this browser.', 'ok');
document.fonts && document.fonts.ready.then(() => { floorLabel.userData.redraw && floorLabel.userData.redraw(); });
window.__planner = { S };
loop();
</script>
